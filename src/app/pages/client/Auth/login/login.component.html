<!-- src/app/pages/auth/login.component.html -->
<div class="login-page">
    <div class="container-css">
      <div class="login-bg">
        <div class="login-brand">
          <img src="/assets/img/logo/shopee-white.png" alt="Shopee" />
          <p>
            Nền tảng thương mại điện tử<br />
            yêu thích ở Đông Nam Á & Đài Loan
          </p>
        </div>
      </div>
  
      <div class="login-form">
        <div class="login-form-box">
          <h2>Đăng nhập</h2>
          <input type="text" placeholder="(+84) 382 742 511" [(ngModel)]="phone" />
          <input type="password" placeholder="Mật khẩu" [(ngModel)]="password" />
          <button >ĐĂNG NHẬP</button>
  
          <div class="login-links">
            <a href="#">Quên mật khẩu</a> <span>•</span> <a href="#">Đăng nhập với SMS</a>
          </div>
  
          <div class="login-or">HOẶC</div>
  
          <div class="login-social">
            <button class="fb">Facebook</button>
            <button class="gg">Google</button>
          </div>
  
          <p class="login-register">
            Bạn mới biết đến Shopee? <a href="#">Đăng ký</a>
          </p>
        </div>
      </div>
    </div>
  </div>
