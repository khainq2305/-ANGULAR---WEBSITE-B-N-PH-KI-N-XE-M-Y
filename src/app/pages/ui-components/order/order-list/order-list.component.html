<mat-card class="order-table-container">
    <mat-card-content>
      <h2 class="title ">Danh sách đơn hàng</h2>
  
      <div class="status-filter-container">
        <div class="status-filter">
            <button class="status-button status-all" (click)="filterStatus('Tất cả')">
                <mat-icon>list</mat-icon> Tất cả
            </button>
          <button class="status-button status-pending" (click)="filterStatus('Chờ xác nhận')">
            <mat-icon>calendar_today</mat-icon> Chờ xác nhận
          </button>
          <button class="status-button status-confirmed" (click)="filterStatus('Đã xác nhận')">
            <mat-icon>build</mat-icon> Đã xác nhận
          </button>
          <button class="status-button status-shipping" (click)="filterStatus('Đang giao')">
            <mat-icon>local_shipping</mat-icon> Đang giao
          </button>
          <button class="status-button status-delivered" (click)="filterStatus('Đã giao')">
            <mat-icon>home</mat-icon> Đã giao
          </button>
          <button class="status-button status-canceled" (click)="filterStatus('Đã hủy')">
            <mat-icon>close</mat-icon> Đã hủy
          </button>
        </div>
    
        <!-- ✅ Đặt ô tìm kiếm cùng hàng với bộ lọc -->
        <mat-form-field appearance="outline" class="search-box">
          <mat-label>Tìm kiếm đơn hàng</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput [(ngModel)]="searchOrderId" (keyup.enter)="searchOrders()" placeholder="Nhập mã đơn hàng..." />
        </mat-form-field>
    </div>
    
      <!-- ✅ Danh sách đơn hàng -->
      <div class="table-container">
        <table mat-table [dataSource]="filteredOrders" class="w-100 mat-elevation-z4">
          
          <ng-container matColumnDef="orderId">
            <th mat-header-cell *matHeaderCellDef class="center">Mã Đơn</th>
            <td mat-cell *matCellDef="let element" class="center"> {{ element.orderId }} </td>
          </ng-container>
  
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
          </ng-container>
  
          <ng-container matColumnDef="orderDate">
            <th mat-header-cell *matHeaderCellDef class="center">Ngày Đặt</th>
            <td mat-cell *matCellDef="let element" class="center"> {{ element.orderDate }} </td>
          </ng-container>
  
          <ng-container matColumnDef="totalAmount">
            <th mat-header-cell *matHeaderCellDef class="center">Tổng Tiền</th>
            <td mat-cell *matCellDef="let element" class="center"> {{ element.totalAmount | number }} VNĐ </td>
          </ng-container>
  
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="center">Trạng Thái</th>
            <td mat-cell *matCellDef="let element" class="center"> 
              <span class="status-label" [ngClass]="{
                'pending': element.status === 'Chờ xác nhận',
                'confirmed': element.status === 'Đã xác nhận',
                'shipping': element.status === 'Đang giao',
                'delivered': element.status === 'Đã giao',
                'canceled': element.status === 'Đã hủy'
              }">{{ element.status }}</span>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="paymentStatus">
            <th mat-header-cell *matHeaderCellDef class="center">Thanh Toán</th>
            <td mat-cell *matCellDef="let element" class="center"> 
              <span [ngClass]="{
                'paid': element.paymentStatus === 'Đã thanh toán',
                'unpaid': element.paymentStatus === 'Chưa thanh toán'
              }">{{ element.paymentStatus }}</span>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="center">Hành Động</th>
            <td mat-cell *matCellDef="let element" class="center">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="viewOrderDetail(element.orderId)">
                  <mat-icon>visibility</mat-icon> Chi tiết
                </button>
                <button mat-menu-item (click)="updateOrderStatus(element)">
                    <mat-icon>edit</mat-icon> Cập nhật trạng thái
                  </button>
                  
                  <button mat-menu-item color="warn" (click)="openConfirmCancelDialog(element.orderId)">
                    <mat-icon>cancel</mat-icon> Hủy đơn
                  </button>
                  
              </mat-menu>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
