<mat-card class="contact-card">
    <mat-card-content>
        <h2 class="title">Danh sách liên hệ</h2>

        <!-- 🔍 Ô tìm kiếm -->
        <div class="search-container">
            <mat-form-field appearance="outline">
                <mat-label>Tìm kiếm</mat-label>
                <input matInput placeholder="Nhập tên hoặc email..." [(ngModel)]="searchQuery" (input)="filterContacts()">
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>

        <!-- 📋 Danh sách liên hệ -->
        <table mat-table [dataSource]="filteredContacts" class="w-100 mat-elevation-z4">

            <!-- 🏷 Cột Tên -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Tên</th>
                <td mat-cell *matCellDef="let contact">{{ contact.name }}</td>
            </ng-container>

            <!-- ✉️ Cột Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let contact">
                    <a [href]="'mailto:' + contact.email" class="email-link">{{ contact.email }}</a>
                </td>
            </ng-container>

            <!-- 📞 Cột Số điện thoại -->
            <ng-container matColumnDef="phone">
                <th mat-header-cell *matHeaderCellDef>Điện thoại</th>
                <td mat-cell *matCellDef="let contact">{{ contact.phone }}</td>
            </ng-container>

           <!-- 📝 Cột Nội dung -->
<ng-container matColumnDef="message">
    <th mat-header-cell *matHeaderCellDef>Nội dung</th>
    <td mat-cell *matCellDef="let contact">
      <span class="truncate-text">{{ contact.message | slice:0:30 }}...</span>
      <button mat-icon-button color="primary" (click)="openMessageDialog(contact)">
        <mat-icon>visibility</mat-icon>
      </button>
    </td>
  </ng-container>
  

            <!-- ✅ Cột Trạng thái -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Trạng thái</th>
                <td mat-cell *matCellDef="let contact">
                    <span [ngClass]="{
                      'status-pending': contact.status === 'Chưa xử lý',
                      'status-handled': contact.status === 'Đã phản hồi'
                    }">
                        {{ contact.status }}
                    </span>
                </td>
            </ng-container>

            <!-- ⚙️ Cột Hành động -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Hành động</th>
                <td mat-cell *matCellDef="let contact">
                    <button mat-icon-button color="primary" (click)="sendEmail(contact)">
                        <mat-icon>email</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" (click)="openConfirmHandleDialog(contact)">
                        <mat-icon>{{ contact.status === 'Đã phản hồi' ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </mat-card-content>
</mat-card>
