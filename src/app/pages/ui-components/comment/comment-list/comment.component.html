<mat-card class="cardWithShadow">
  <mat-card-content>
    <h2 class="title">
     Quản lý bình luận sản phẩm
    </h2>

    <div class="status-filter-container">
      <div class="status-filter">
        <button mat-stroked-button class="status-button status-all" (click)="setFilter('all')">
          <mat-icon>list</mat-icon> Tất cả
        </button>
        <button mat-stroked-button class="status-button status-high" (click)="setFilter('highest')">
          <mat-icon>arrow_upward</mat-icon> Bình luận cao nhất
        </button>
        <button mat-stroked-button class="status-button status-low" (click)="setFilter('lowest')">
          <mat-icon>arrow_downward</mat-icon> Bình luận thấp nhất
        </button>
      </div>

      <div class="status-filter">
        <button mat-stroked-button class="status-button status-sort" (click)="toggleSortOrder()">
          <mat-icon>{{ sortOrder === 'asc' ? 'expand_less' : 'expand_more' }}</mat-icon>
          {{ sortOrder === 'asc' ? 'Sắp xếp tăng dần' : 'Sắp xếp giảm dần' }}
        </button>
      </div>
      

      <mat-form-field appearance="outline" class="search-box">
        <mat-label>Tìm kiếm sản phẩm</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" placeholder="Nhập tên sản phẩm..." />
      </mat-form-field>
    </div>
    <div class="table-container">

      
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 large-table">
        <ng-container matColumnDef="stt">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ getIndex(i) }}
          </td>
        </ng-container>
        

        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef>Ảnh</th>
          <td mat-cell *matCellDef="let element">
            <img [src]="element.imageUrl" class="product-image" alt="{{ element.productName }}">
          </td>
        </ng-container>

        <ng-container matColumnDef="productName">
          <th mat-header-cell *matHeaderCellDef>Sản phẩm</th>
          <td mat-cell *matCellDef="let element">{{ element.productName }}</td>
        </ng-container>

        <ng-container matColumnDef="totalComments">
          <th mat-header-cell *matHeaderCellDef>Tổng bình luận</th>
          <td mat-cell *matCellDef="let element">
            <span class="comment-count">{{ element.totalComments }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Hành động</th>
          <td mat-cell *matCellDef="let element">
            <button mat-stroked-button color="primary" (click)="viewDetail(element.productId)">
              <mat-icon>visibility</mat-icon> Xem chi tiết
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
