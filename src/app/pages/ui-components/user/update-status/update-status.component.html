<h2 mat-dialog-title>Cập nhật trạng thái</h2>
<mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Trạng thái</mat-label>
    <mat-select [formControl]="statusControl">
      <mat-option [value]="1">Hoạt động</mat-option>
      <mat-option [value]="0">Tạm ngưng</mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Hủy</button>
  <button mat-flat-button color="primary" (click)="updateStatus()">Cập nhật</button>
</mat-dialog-actions>
