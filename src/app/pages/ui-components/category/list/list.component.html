<mat-card class="cardWithShadow">
    <mat-card-content>
     
      <mat-card-title>Danh sách các danh mục</mat-card-title>
      <div class="row m-t-10">
        <div class="col-sm-3">
          <mat-label class="f-w-600 m-b-8 d-block">Tìm kiếm</mat-label>
          <mat-form-field appearance="outline" color="primary" class="mat-mdc-form-field w-100 p-y-0">
            <input matInput (keyup)="applyFilter($event)" placeholder="Tên sản phẩm" class="mat-mdc-input-element py-0" #input>
          </mat-form-field>
        </div>
        <div class="col-sm-2">
          <mat-label class="f-w-600 m-b-8 d-block">Trạng thái</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select [(ngModel)]="filterStatus" (selectionChange)="setFilterStatus($event.value)" class="f-w-700" >
              <mat-option [value]="'all'">Tất cả</mat-option>
              <mat-option [value]="1">Đang hoạt động</mat-option>
              <mat-option [value]="0">Dừng hoạt động</mat-option>
            </mat-select>
          </mat-form-field>
        </div>         
      </div>
  
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource1" matSort matSortActive="name" matSortDirection="asc" class="w-100">
          <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
              #
            </th>
            <td mat-cell *matCellDef="let element; let i = index" class="p-l-0">
              <div class="d-flex align-items-center">
                <div class="m-l-5">
                  <h6 class="f-s-14 f-w-600 text-start">
                    {{ i + 1 }}
                  </h6>
                </div>
              </div>
            </td>
          </ng-container>
          <!-- Position Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header="uname" class="f-w-600 f-s-14 p-l-16">
              Tên danh mục
            </th>
            <td mat-cell *matCellDef="let element" class="p-l-0" class="col-sm-9">
              <div class="d-flex align-items-center">
                <div class="m-l-0">
                  <!-- Sử dụng [innerHTML] kết hợp với pipe highlight -->
                  <h6 class="f-s-14 f-w-600 text-start" [appHighlight]="element.uname" [searchText]="searchText">
                    {{ element.uname }}
                  </h6>
                </div>
              </div>
            </td>
          </ng-container>
  
          <!-- status Column -->
          <ng-container matColumnDef="status" class="col-sm-2">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">
              Trạng thái
            </th>
            <td mat-cell *matCellDef="let element" >
              <span *ngIf="element.status == 1" class="bg-light-success text-success rounded f-w-600 p-6 p-y-4 f-s-12">
                Đang hoạt động
              </span>
              <span *ngIf="element.status == 0" class="bg-light-error text-error rounded f-w-600 p-6 p-y-4 f-s-12">
                Dừng hoạt động
              </span>
            </td>
          </ng-container>
  
  
          <ng-container matColumnDef="budget">
            <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
            <td mat-cell *matCellDef="let element" class="col-sm-2">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item>
                  <mat-icon>edit</mat-icon>
                  <span [routerLink]="['/ui-components/category/edit', 1]">Chỉnh sửa</span>
                </button>
                <button mat-menu-item>
                  <mat-icon>delete</mat-icon>
                  <span >Xóa</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns1"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns1"></tr>
        </table>
      </div>
      <div *ngIf="showNotFound" class="text-center m-t-10">
        Không tìm thấy dữ liệu
      </div>
    </mat-card-content>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
  </mat-card>
