<mat-card class="cardWithShadow">
  <mat-card-content>
    <h2>Danh sách danh mục đã xóa</h2>

    <div class="row align-items-center mt-3 mb-3 p-3 rounded">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Tìm kiếm danh mục</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilters()" />
        </mat-form-field>
      </div>

      <div class="col-md-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Ngày xóa</mat-label>
          <input matInput [matDatepicker]="deletedDatePicker" [(ngModel)]="filterDate" (dateChange)="applyFilters()">
          <mat-datepicker-toggle matSuffix [for]="deletedDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #deletedDatePicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-md-3">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Sắp xếp theo</mat-label>
          <mat-select [(ngModel)]="sortCriteria" (selectionChange)="applySort()">
            <mat-option value="nameAsc">Tên A → Z</mat-option>
            <mat-option value="nameDesc">Tên Z → A</mat-option>
            <mat-option value="dateAsc">Ngày xóa cũ → mới</mat-option>
            <mat-option value="dateDesc">Ngày xóa mới → cũ</mat-option>
          </mat-select>
        </mat-form-field>
      </div>      
    </div>

    <div class="table-responsive">
      <table mat-table [dataSource]="deleteCategory" class="w-100 mat-elevation-z8">
        
        <!-- Checkbox chọn -->
        <!-- Checkbox select all -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
              (change)="toggleSelectAll($event)"
              [checked]="isAllSelected()"
              [indeterminate]="isIndeterminate()"
            >
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [(ngModel)]="element.selected" (change)="updateSelectedCategories(element)"></mat-checkbox>
          </td>
          
        </ng-container>
        

        <!-- STT -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef class="text-center">#</th>
          <td mat-cell *matCellDef="let element; let i = index" class="text-center">
            {{ i + 1 }}
          </td>
        </ng-container>

        <!-- Hình ảnh -->
        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef>Hình ảnh</th>
          <td mat-cell *matCellDef="let element">
            <img [src]="getImageUrl(element.imageUrl)" alt="{{ element.name }}" class="img-thumbnail" width="50" height="50">
          </td>
        </ng-container>

        <!-- Tên danh mục -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Tên danh mục</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <!-- Ngày xóa -->
        <ng-container matColumnDef="deletedAt">
          <th mat-header-cell *matHeaderCellDef>Ngày xóa</th>
          <td mat-cell *matCellDef="let element">{{ element.deletedAt | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <!-- Hành động -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Hành động</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="actionMenu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #actionMenu="matMenu">
              <button mat-menu-item (click)="restoreCategory(element)">
                <mat-icon color="primary">restore</mat-icon> <span>Khôi phục</span>
              </button>
              <button mat-menu-item (click)="confirmDelete(element)">
                <mat-icon>delete</mat-icon> Xóa vĩnh viễn
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <!-- Header + Rows -->
        <tr mat-header-row *matHeaderRowDef="['select', 'index', 'image', 'name', 'deletedAt', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['select', 'index', 'image', 'name', 'deletedAt', 'actions'];"></tr>
      </table>

      <div *ngIf="showNotFound" class="text-center text-muted mt-4">
        <p>Không tìm thấy danh mục nào phù hợp.</p>
      </div>
    </div>

    <!-- Nút khôi phục -->
    <div class="mt-3 text-right">
      <button mat-raised-button color="primary" [disabled]="selectedCategories.length === 0" (click)="restoreSelectedCategories()">
        <mat-icon>restore</mat-icon> Khôi phục đã chọn
      </button>
    </div>

  </mat-card-content>
</mat-card>
