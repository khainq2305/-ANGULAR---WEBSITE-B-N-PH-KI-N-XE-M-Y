<h2 mat-dialog-title>Xác nhận</h2>
<mat-dialog-content>
  <p>Bạn có chắc chắn muốn cấp lại mật khẩu cho <strong>{{ data.name }}</strong>?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Hủy</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="true">Xác nhận</button>
</mat-dialog-actions>
