<h2 mat-dialog-title>Xác nhận hủy đơn hàng</h2>

<mat-dialog-content>
  <p>Bạn có chắc chắn muốn hủy đơn hàng <strong>{{ data.orderCode }}</strong> không?</p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Chọn lý do</mat-label>
    <mat-select [(ngModel)]="selectedReason" (selectionChange)="onReasonChange($event.value)">
      <mat-option *ngFor="let reason of cancelReasons" [value]="reason">{{ reason }}</mat-option>
      <mat-option value="other">Lý do khác</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field *ngIf="isOtherReason" appearance="outline" class="full-width">
    <mat-label>Nhập lý do</mat-label>
    <textarea matInput [(ngModel)]="customReason"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(false)">Hủy</button>
  <button mat-flat-button color="warn" (click)="confirmCancel()">Xác nhận</button>
</mat-dialog-actions>
