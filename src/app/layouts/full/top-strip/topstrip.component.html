<div class="app-topstrip bg-dark text-white p-y-10 p-x-20 w-100 d-lg-flex align-items-center justify-content-between">
  <!-- BÊN TRÁI: LOGO + TÌM KIẾM -->
  <div class="d-flex align-items-center gap-3">
    <app-branding></app-branding>

    <!-- ICON TÌM KIẾM -->
    <button mat-icon-button aria-label="Search">
      <i-tabler name="search" class="icon-20 text-white"></i-tabler>
    </button>
  </div>

  <!-- BÊN PHẢI: THÔNG BÁO + AVATAR -->
  <div class="d-flex align-items-center gap-3">
    <!-- ICON THÔNG BÁO -->
    <button mat-icon-button aria-label="Notifications">
      <i-tabler name="bell" class="icon-20 text-white"></i-tabler>
    </button>

    <!-- AVATAR/Profile -->
    <button mat-mini-fab [matMenuTriggerFor]="profilemenu" aria-label="User">
      <img src="/assets/images/profile/user-1.jpg" class="rounded-circle object-cover d-block" width="35" />
    </button>

    <!-- Profile Dropdown -->
    <mat-menu #profilemenu="matMenu" class="cardWithShadow topbar-dd">
      <button mat-menu-item>
        <mat-icon class="d-flex align-items-center">
          <i-tabler name="user" class="icon-18 d-flex"></i-tabler>
        </mat-icon>
        My Profile
      </button>
      <button mat-menu-item>
        <mat-icon class="d-flex align-items-center">
          <i-tabler name="mail" class="icon-18 d-flex"></i-tabler>
        </mat-icon>
        My Account
      </button>
      <button mat-menu-item>
        <mat-icon class="d-flex align-items-center">
          <i-tabler name="list-check" class="icon-18 d-flex"></i-tabler>
        </mat-icon>
        My Task
      </button>

      <div class="p-x-12 m-t-12">
        <a [routerLink]="['/authentication/login']" mat-stroked-button class="w-100">Logout</a>
      </div>
    </mat-menu>
  </div>
</div>
